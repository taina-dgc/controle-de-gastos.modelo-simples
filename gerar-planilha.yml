# Gera a planilha de exemplo automaticamente sempre que o código ou a configuração mudar.
# O arquivo fica disponível para download na aba "Actions" do GitHub (em "Artifacts").
name: Gerar planilha de exemplo

on:
  push:
    paths: ["gerar_planilha.py", "config.json", "dados/exemplo.json"]
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python gerar_planilha.py --saida Contas_Mensais_exemplo.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: planilha-exemplo
          path: Contas_Mensais_exemplo.xlsx
